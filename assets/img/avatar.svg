<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Sfondo Circolare -->
  <circle cx="100" cy="100" r="100" fill="#0A1F3D"/>
  
  <!-- Collo e Giacca -->
  <polygon points="70,160 100,140 130,160 150,200 50,200" fill="#2D3748"/>
  <polygon points="100,140 85,170 100,200 115,170" fill="#6C4AB6"/> <!-- Cravatta/Dettaglio -->
  
  <!-- Viso (Base) -->
  <polygon points="70,60 100,50 130,60 140,100 120,140 100,150 80,140 60,100" fill="#F5F7FA"/>
  
  <!-- Capelli -->
  <polygon points="60,60 75,40 100,35 125,40 140,60 130,50 100,45 70,50" fill="#1A202C"/>
  <polygon points="60,60 55,80 65,75 70,60" fill="#1A202C"/> <!-- Ciuffo laterale -->
  
  <!-- Ombre Viso (Low-Poly) -->
  <polygon points="60,100 80,140 100,150 100,100" fill="#E2E8F0"/> <!-- Guancia sinistra -->
  <polygon points="100,100 100,150 120,140 140,100" fill="#CBD5E0"/> <!-- Guancia destra -->
  <polygon points="80,140 100,150 100,130" fill="#A0AEC0"/> <!-- Mascella -->
  
  <!-- Occhi -->
  <polygon points="75,90 85,85 90,90 80,95" fill="#2D3748"/>
  <polygon points="110,85 125,90 120,95 115,90" fill="#2D3748"/>
  
  <!-- Naso -->
  <polygon points="100,95 95,115 105,115" fill="#CBD5E0"/>
  
  <!-- Bocca (Accenno di sorriso) -->
  <polygon points="85,125 100,130 115,125 100,135" fill="#6C4AB6"/>
  
  <!-- Dettaglio Tech (Accento Arancio) -->
  <polygon points="130,60 140,80 135,85" fill="#FF7A00"/>
</svg>